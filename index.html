<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>vibecodemods/</title>
<meta name="description" content="Browser mods for the games and sites we use.">
<style>
:root{--bg:#06060a;--s1:rgba(255,255,255,.035);--s2:rgba(255,255,255,.06);--ln:rgba(255,255,255,.08);--ln2:rgba(255,255,255,.14);
--fg:#f3f2f8;--dim:#8d8b9c;--acc:#a58bff;--grad:linear-gradient(90deg,#8b6cff,#58c7ff);color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;background:radial-gradient(70% 45% at 85% 0%,rgba(124,92,255,.22),transparent 65%),radial-gradient(55% 40% at 0% 10%,rgba(56,170,255,.1),transparent 70%),var(--bg);
color:var(--fg);font:15px/1.55 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;padding:64px 16px 72px}
main{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:32px}
.logo{width:min(340px,78%);height:auto;display:block}
.lead{color:var(--dim);font-size:16px;max-width:52ch}
h2{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);margin-bottom:14px}
.mods{display:flex;flex-direction:column;gap:12px}
a.mod{display:flex;align-items:center;gap:16px;text-decoration:none;color:inherit;background:var(--s1);border:1px solid var(--ln);border-radius:16px;padding:18px 20px;transition:border-color .15s,transform .12s,background .15s}
a.mod:hover{border-color:var(--ln2);background:var(--s2);transform:translateY(-1px)}
.mod .tag{flex:0 0 auto;width:46px;height:46px;border-radius:12px;display:grid;place-items:center;font-weight:800;font-size:18px;letter-spacing:-.02em;
background:var(--grad);color:#08070d;box-shadow:0 6px 18px -8px rgba(140,110,255,.7)}
.mod .body{flex:1;min-width:0}
.mod .body b{display:block;font-size:16px}
.mod .body span{color:var(--dim);font-size:13.5px}
.mod .go{flex:0 0 auto;color:var(--dim);font-size:20px;transition:transform .12s,color .12s}
a.mod:hover .go{color:var(--fg);transform:translateX(2px)}
.soon{opacity:.55;cursor:default;border-style:dashed}
.soon:hover{transform:none;background:var(--s1);border-color:var(--ln)}
.soon .tag{background:var(--s2);color:var(--dim);box-shadow:none}
footer{color:var(--dim);font-size:12px;text-align:center}
footer a{color:var(--dim)}
</style>
</head>
<body>
<main>
<header>
<img class="logo" src="buildyourstax/assets/vibecodemods-logo.png" alt="vibecodemods/">
</header>
<p class="lead">Browser mods for the games and sites we use. Pick one below.</p>

<section>
<h2>Mods</h2>
<div class="mods">
<a class="mod" href="buildyourstax/">
<div class="tag">S</div>
<div class="body"><b>Build Your Stax</b><span>buildyourstax.com — add cash, unlock everything, control events &amp; the lobby</span></div>
<div class="go">→</div>
</a>
<div class="mod soon">
<div class="tag">+</div>
<div class="body"><b>More coming</b><span>New sites get their own folder here.</span></div>
</div>
</div>
</section>

<footer>vibecodemods/ · <a href="https://github.com/killllllformatt/vibecodemods">source on GitHub</a></footer>
</main>
</body>
</html>
